{% extends "base.html" %}{% block content %}<h1 class="mb-5 text-3xl font-bold">Recent announcements</h1><div class="space-y-4">{% for a in announcements %}<article class="rounded-xl border bg-white p-5"><h2 class="font-semibold">{{ a.title }}</h2><p class="mt-2 whitespace-pre-line">{{ a.body }}</p><p class="mt-3 text-xs text-slate-500">{{ a.club_name or 'Club' }}{% if a.team_name %} · {{ a.team_name }}{% endif %} · {{ a.posted_at }}</p></article>{% else %}<p>No recent announcements.</p>{% endfor %}</div>{% endblock %}
