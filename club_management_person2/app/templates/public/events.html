{% extends "base.html" %}{% block content %}<h1 class="mb-5 text-3xl font-bold">Upcoming events</h1><div class="grid gap-4 md:grid-cols-2">{% for e in events %}<article class="rounded-xl border bg-white p-5"><h2 class="font-semibold">{{ e.name }}</h2><p class="mt-2 text-sm">{{ e.event_date }} · {{ e.venue or 'Venue to be announced' }}</p><p class="mt-2 text-sm">Registrations: {{ e.registered_count }} / {{ e.capacity or 'Unlimited' }}</p></article>{% else %}<p>No upcoming events.</p>{% endfor %}</div>{% endblock %}
