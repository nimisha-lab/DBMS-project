{% extends "base.html" %}{% block content %}<h1 class="mb-5 text-3xl font-bold">My registrations</h1><div class="overflow-x-auto rounded border bg-white"><table class="w-full text-left text-sm"><thead class="bg-slate-100"><tr><th class="p-3">Event</th><th class="p-3">Date</th><th class="p-3">Venue</th><th class="p-3">Status</th></tr></thead><tbody>{% for r in registrations %}<tr class="border-t"><td class="p-3">{{ r.name }}</td><td class="p-3">{{ r.event_date }}</td><td class="p-3">{{ r.venue or '—' }}</td><td class="p-3">{{ r.status }}</td></tr>{% else %}<tr><td colspan="4" class="p-3">No registrations.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
